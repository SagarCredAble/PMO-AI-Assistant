<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMO AI Assistant V1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6f9;margin:0}
.header{background:#0f4c81;color:#fff;padding:16px;font-size:22px;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:20px}
.chat{height:500px;overflow-y:auto;background:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.user,.bot{padding:12px;border-radius:10px;margin-bottom:10px;white-space:pre-wrap}
.user{background:#dbeafe}.bot{background:#f3f4f6}
.shortcuts button,.sendBtn{margin:4px;padding:10px 14px;cursor:pointer}
.inputRow{display:flex;gap:10px;margin-top:15px}.inputRow input{flex:1;padding:12px}
</style>
</head>
<body>
<div class="header">PMO AI Assistant V1</div>
<div class="container">
<p><b>Setup:</b> Replace YOUR_SUPABASE_URL and YOUR_SUPABASE_ANON_KEY in the script.</p>
<div class="shortcuts">
<button onclick="runCommand('portfolio summary')">Portfolio Summary</button>
<button onclick="runCommand('show overdue actions')">Overdue Actions</button>
<button onclick="runCommand('show open actions')">Open Actions</button>
<button onclick="runCommand('show blocked actions')">Blocked Actions</button>
<button onclick="runCommand('show latest updates')">Latest Updates</button>
<button onclick="runCommand('pmo snapshot')">PMO Snapshot</button>
<button onclick="runCommand('show delayed tasks')">Delayed Tasks</button>
<button onclick="runCommand('what needs attention today')">Attention Today</button>
</div>
<div id="chat" class="chat"></div>
<div class="inputRow">
<input id="userInput" placeholder="Ask PMO AI Assistant..." onkeypress="if(event.key==='Enter'){sendMessage();}">
<button class="sendBtn" onclick="sendMessage()">Send</button>
</div>
</div>
<script>
const SUPABASE_URL='https://euspixnbhrzjanfypqon.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1c3BpeG5iaHJ6amFuZnlwcW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDA1NDcsImV4cCI6MjA5OTc3NjU0N30.iduQE07Bf_tmxuojJIc3j9rMTZkyekmaX6pnnd4NiF0';
let supabaseClient=null;
if(window.supabase){supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);} 
const chat=document.getElementById('chat');
function addUser(t){chat.innerHTML+=`<div class="user">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
function addBot(t){chat.innerHTML+=`<div class="bot">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
addBot(`Hello Sagar,

I am PMO AI Assistant.

Available Commands:

• Portfolio Summary
• PMO Snapshot
• Show Overdue Actions
• Show Open Actions
• Show Blocked Actions
• Show Delayed Tasks
• Show Latest Updates
• What Needs Attention Today
`);
function sendMessage(){const i=document.getElementById('userInput');const t=i.value.trim();if(!t)return;i.value='';runCommand(t);}
async function runCommand(cmd){

    addUser(cmd);

    const c = cmd.toLowerCase();

    if(c.includes('portfolio'))
        return loadView('vw_portfolio_summary');

    if(c.includes('overdue'))
        return loadView('vw_overdue_actions');

    if(c.includes('open actions'))
        return loadView('vw_open_actions');

    if(c.includes('blocked'))
        return loadView('vw_blocked_actions');

    if(c.includes('latest'))
        return loadView('vw_latest_updates');

    if(c.includes('snapshot'))
        return loadView('vw_pmo_snapshot');

    if(c.includes('delayed'))
        return loadView('vw_delayed_tasks');

    if(c.includes('attention'))
        return loadView('vw_attention_today');

    addBot('Command not recognised');
}
async function loadView(view){

    if(!supabaseClient){
        addBot('Supabase connection not available');
        return;
    }

    const {data,error} =
        await supabaseClient
            .from(view)
            .select('*')
            .limit(20);

    if(error){
        addBot(error.message);
        return;
    }

    if(view === 'vw_portfolio_summary'){

        const p=data[0];

        addBot(
`Portfolio Summary

Projects : ${p.projects}

Tasks : ${p.tasks}

Actions : ${p.actions}

Updates : ${p.updates}`
        );

        return;
    }

    if(view === 'vw_pmo_snapshot'){

        const s=data[0];

        addBot(
`PMO Snapshot

Projects : ${s.projects}

Tasks : ${s.tasks}

Actions : ${s.actions}

Overdue Actions : ${s.overdue_actions}

Blocked Actions : ${s.blocked_actions}

Recent Updates : ${s.recent_updates}`
        );

        return;
    }

    if(view === 'vw_attention_today'){

        let output =
`What Needs Attention Today

`;

        data.forEach(x => {

            output +=
`${x.category}

Count : ${x.total}

`;
        });

        addBot(output);
        return;
    }

    if(view === 'vw_delayed_tasks'){

        let output =
`Delayed Tasks

`;

        data.forEach(x => {

            output +=
`${x.project_name}

${x.task_name}

Owner : ${x.owner}

Planned End : ${x.planned_end}

Status : ${x.status}

-----------------------

`;
        });

        addBot(output);
        return;
    }
    if(view === 'vw_overdue_actions'){

    let output =
`Overdue Actions (${data.length})

`;

    data.forEach(action => {

        output +=
`#${action.item_no}

${action.title}

Assigned To : ${action.assigned_to || 'Unassigned'}

Priority : ${action.priority}

Status : ${action.status}

Due Date : ${action.due_date}

-----------------------

`;

    });

    addBot(output);
    return;
}
if(view === 'vw_open_actions'){

    let output =
`Open Actions (${data.length})

`;

    data.forEach(action => {

        output +=
`#${action.item_no}

${action.title}

Assigned To : ${action.assigned_to || 'Unassigned'}

Priority : ${action.priority}

Status : ${action.status}

-----------------------

`;

    });

    addBot(output);
    return;
}
if(view === 'vw_blocked_actions'){

    let output =
`Blocked Actions (${data.length})

`;

    data.forEach(action => {

        output +=
`#${action.item_no}

${action.title}

Assigned To : ${action.assigned_to || 'Unassigned'}

Reason :

${action.blocker_reason || 'No reason provided'}

-----------------------

`;

    });

    addBot(output);
    return;
}
if(view === 'vw_latest_updates'){

    let output =
`Latest Updates

`;

    data.forEach(update => {

        output +=
`${update.author_name || 'Unknown'}

${update.remark_date || ''}

${update.remark_text || ''}

-----------------------

`;

    });

    addBot(output);
    return;
}

    addBot(JSON.stringify(data,null,2));
}
</script>
</body>
</html>
